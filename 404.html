<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="404 - Page not found. Return to the home page.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Page Not Found</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
</head>
<body>
  <button id="themeToggle" class="theme-toggle">🌙 Dark Mode</button>

  <div class="container page">
    <div class="content">
      <h1>404</h1>
      <p>Oops! That page couldn't be found.</p>
      <p>It looks like this car has been sold or never existed.</p>
      <button onclick="window.location.href='index.html'" class="car-button">Back to Home</button>
    </div>
  </div>

  <footer>
    <a href="https://swirl.hackclub.com/">Hack Club Swirl</a>
    <a href="https://github.com/pandreev67/swirl-hackclub">GitHub</a>
  </footer>

  <script>
    const toggle = document.getElementById('themeToggle');
    const html = document.documentElement;

    // Check saved theme
    const savedTheme = localStorage.getItem('theme') || 'dark';
    html.setAttribute('data-theme', savedTheme);
    updateButtonText(savedTheme);

    toggle.addEventListener('click', () => {
      const currentTheme = html.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      html.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateButtonText(newTheme);
    });

    function updateButtonText(theme) {
      toggle.textContent = theme === 'dark' ? '🌙 Dark Mode' : '☀️ Light Mode';
    }
  </script>
</body>
</html>
