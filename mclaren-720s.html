<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="description" content="McLaren 720S specs.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>McLaren 720S</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>">
  <script>
    (function() {
      const saved = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>
</head>
<body>
  <button id="themeToggle" class="theme-toggle"> Dark Mode</button>

  <div class="container page">
    <div class="content">
      <h1>McLaren 720S</h1>
      
      <p><strong>Why I like it:</strong>  love the McLaren 720S because of its insane speed and unmatched aura.</p>

      <table class="spec-table">
        <tr>
          <th>Engine</th>
          <td>4.0L Twin-Turbo V8</td>
        </tr>
        <tr>
          <th>Power</th>
          <td>710 hp</td>
        </tr>
        <tr>
          <th>0-60 mph</th>
          <td>2.8 seconds</td>
        </tr>
        <tr>
          <th>Top Speed</th>
          <td>212 mph</td>
        </tr>
      </table>

      <img src="img/mclaren-black.jpg" alt="McLaren 720S black" style="max-width: 100%; border-radius: 8px; margin-top: 20px;">
      
      <br>
      <a href="index.html" class="car-button">Back to Garage</a>
    </div>
  </div>

  <footer>
    <a href="https://swirl.hackclub.com/">Hack Club Swirl</a>
    <a href="https://github.com/pandreev67/swirl-hackclub">GitHub</a>
    <a href="mailto:Andreev.p@iss.ac.th">Email</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
